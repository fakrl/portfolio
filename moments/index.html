<script>
/* Shows the newest guestbook post as soon as its data is there (cache or REST), long before the page
   scripts have run. The page script replaces it with the real carousel post, same markup. */
(function () {
    var e = window.__fbEarly, l = document.getElementById('feedbackList');
    if (!e || !l) return;
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function rel(ts) {
        if (!ts) return '';
        var d = Date.now() - ts; if (d < 60000) return 'just now';
        var m = Math.floor(d / 60000); if (m < 60) return m + 'm';
        var h = Math.floor(m / 60); if (h < 24) return h + 'h';
        var dd = Math.floor(h / 24); if (dd < 7) return dd + 'd';
        return new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function show(data) {
        if (!data || l.querySelector('.gb-post')) return;
        var keys = Object.keys(data); if (!keys.length) return;
        var it = data[keys[keys.length - 1]]; if (!it) return;
        var empty = document.getElementById('feedbackEmpty'); if (empty) empty.style.display = 'none';
        var p = document.createElement('article');
        p.className = 'gb-post gb-post--carousel';
        p.setAttribute('data-pre', '1');
        p.innerHTML = '<span class="gb-avatar">' + esc((it.nama || '?').charAt(0).toUpperCase()) + '</span>' +
            '<div class="gb-main"><div class="gb-head"><span class="gb-name">' + esc(it.nama) + '</span><span class="gb-time">· ' + rel(it.waktu) + '</span></div>' +
            (it.dari ? '<div class="gb-from">' + esc(it.dari) + '</div>' : '') +
            '<p class="gb-text">' + esc(it.pesan) + '</p></div>';
        l.appendChild(p);
    }
    if (e.cached) show(e.cached);
    e.promise.then(show);
})();
</script>

<script>
(function() {
    const DB_URL = 'https://fakrul-feeeb-default-rtdb.asia-southeast1.firebasedatabase.app/stats/visits/count.json';
    const pill = document.getElementById('visitorPill');
    const countEl = document.getElementById('visitorCount');
    if (!pill || !countEl) return;

    const alreadyCounted = localStorage.getItem('rb_visited') === '1';

    fetch(DB_URL)
        .then(r => r.json())
        .then(current => {
            current = typeof current === 'number' ? current : 0;
            if (!alreadyCounted) {
                const next = current + 1;
                localStorage.setItem('rb_visited', '1');
                countEl.textContent = next.toLocaleString('en-US');
                fetch(DB_URL, { method: 'PUT', body: JSON.stringify(next) }).catch(() => {});
            } else {
                countEl.textContent = current.toLocaleString('en-US');
            }
            pill.style.display = 'inline-flex';
        })
        .catch(() => { /* silent — no counter shown if the DB call fails */ });
})();
</script>

    window.addEventListener('scroll', update, { passive: true });
    update();
})();
</script>

<!-- Yearbook: load the gated reader only when asked. -->
<script>
(function () {
    const btn = document.getElementById('yearbookOpen');
    const stage = document.getElementById('yearbookStage');
    if (!btn || !stage) return;
    const lang = () => document.documentElement.lang === 'id' ? 'id' : 'en';
    const newTab = document.querySelector('.yearbook-link');
    newTab?.addEventListener('click', () => { newTab.href = '/yearbook/?lang=' + lang() + '#52'; });
    btn.addEventListener('click', () => {
        const f = document.createElement('iframe');
        const figure = stage.closest('.yearbook');
        const t = (typeof I18N !== 'undefined') && I18N['yearbook.frameTitle'];
        f.title = (t && t[lang()]) || 'Digital yearbook 2023';
        f.src = '/yearbook/?lang=' + lang() + '#52';
        f.allow = 'fullscreen';
        f.setAttribute('allowfullscreen', '');
        f.loading = 'eager';
        stage.prepend(f);
        figure.classList.add('is-open');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            btn.hidden = true;
            return;
        }
        figure.classList.add('is-opening');
        window.setTimeout(() => {
            figure.classList.remove('is-opening');
            btn.hidden = true;
            f.focus();
        }, 680);
    });
})();
</script>
