<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof of Work — Fakhrul Mukhlisin</title>
    <meta name="robots" content="noindex">
    <!--
        /proof/ used to be the single combined page (tabs: Projects / Certifications / Awards).
        It's now split into 3 standalone pages: /projects/, /certifications/, /awards/.
        This stub exists ONLY so old links still work — most importantly the CV PDF,
        which has hyperlinks baked in as fakrul.netlify.app/proof/#<id> (e.g. #bnsp,
        #proj-evermos). Do not delete this file; regenerate the CV before removing it.
    -->
    <script>
        (function() {
            var CERT_IDS   = ['bnsp','evermos','core-initiative','huawei','google-pm','lka-unpam','azure','yandex','jurnal','ukbi'];
            var AWARD_IDS  = ['award-foto','award-ketum','award-diploy','award-lka'];
            var PROJECT_IDS = ['proj-nobel','proj-evermos','proj-core-initiative','proj-cms','proj-ypkb','proj-groomy'];

            var hash = window.location.hash.replace('#', '');
            var tabAliases = { 'tab-certifications': '/certifications/', 'tab-awards': '/awards/', 'tab-projects': '/projects/' };

            var dest = '/projects/'; // default landing
            if (tabAliases[hash]) {
                dest = tabAliases[hash];
                hash = '';
            } else if (CERT_IDS.indexOf(hash) !== -1) {
                dest = '/certifications/';
            } else if (AWARD_IDS.indexOf(hash) !== -1) {
                dest = '/awards/';
            } else if (PROJECT_IDS.indexOf(hash) !== -1) {
                dest = '/projects/';
            }

            window.location.replace(dest + (hash ? '#' + hash : ''));
        })();
    </script>
</head>
<body>
    <p style="font-family:sans-serif; padding:2rem;">
        Redirecting to <a id="fallbackLink" href="/projects/">the new Proof of Work pages</a>…
    </p>
</body>
</html>
