<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191f">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <title>Yearbook 2023</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 10px; padding: 12px; background: #17191f; color: #f5f5f5; font: 14px/1.4 system-ui, sans-serif; }
    .book { display: grid; grid-template-rows: minmax(0, 1fr); place-items: stretch; min-height: 0; perspective: 1200px; }
    .spread { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); align-items: stretch; gap: 1px; width: 100%; height: 100%; min-height: 0; }
    .spread.double { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .spread.single { max-width: min(100%, 48vh); }
    .page-slot { display: grid; place-items: center; width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; background: #111318; }
    .page-slot img { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 130px); object-fit: contain; box-shadow: 0 8px 32px #0008; }
    .page-slot:empty { background: transparent; }
    .spread.turning { animation: turn 350ms ease both; transform-origin: center; }
    @keyframes turn { from { opacity: .25; transform: rotateY(-7deg); } to { opacity: 1; transform: rotateY(0); } }
    @media (prefers-reduced-motion: reduce) { .spread.turning { animation: fade .15s ease both; } @keyframes fade { from { opacity: .4; } to { opacity: 1; } } }
    .toolbar { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; }
    button, input { min-height: 38px; border: 1px solid #ffffff30; border-radius: 8px; background: #ffffff12; color: inherit; font: inherit; }
    button { padding: 0 12px; cursor: pointer; }
    button:hover:not(:disabled) { background: #ffffff24; }
    button:disabled { opacity: .45; cursor: default; }
    input { width: 5.5em; padding: 0 8px; text-align: center; }
    .lock-panel { width: min(100%, 320px); padding: 20px; text-align: center; }
    .lock-panel .lock { font-size: 1.5rem; }
    .lock-panel p { margin: 8px 0; color: #c8cad2; }
    .lock-panel form { display: grid; gap: 8px; }
    .lock-panel input { width: 100%; text-align: left; }
    .status { min-height: 1.4em; color: #f2c5c5; }
    .status[role="status"] { color: #d3d5de; }
    .photos { display: flex; justify-content: center; }
    :focus-visible { outline: 2px solid #9fc5ff; outline-offset: 2px; }
    @media (min-width: 700px) { .spread.double { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 699px) {
      body { padding: 8px; gap: 6px; }
      .spread.double { grid-template-columns: minmax(0, 1fr); }
      .spread.single { max-width: 100%; }
      .toolbar { gap: 5px; }
      button { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <main class="book" id="book" aria-label="Digital yearbook"></main>
  <form class="toolbar" id="pageForm" aria-label="Yearbook controls">
    <button id="previousPage" type="button" aria-label="Previous spread">←</button>
    <label><span id="pageStatus" aria-live="polite">Loading yearbook…</span>
      <input id="pageNumber" type="number" min="1" max="260" value="52" aria-label="Go to page">
    </label>
    <button id="goPage" type="submit">Go</button>
    <button id="nextPage" type="button" aria-label="Next spread">→</button>
    <button id="fullscreen" type="button" aria-label="Toggle fullscreen">⛶</button>
  </form>
  <div class="photos"><button id="myPhotos" type="button">My photos</button></div>
  <script>
    <!-- READER_CRYPTO_START -->
    function normalizeReaderPassword(value) {
      return value.normalize('NFKC').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
    }

    async function deriveReaderKey(password, salt, iterations) {
      const material = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(normalizeReaderPassword(password)),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        true,
        ['decrypt']
      );
    }

    async function decryptPayload(payload, key) {
      const bytes = payload instanceof Uint8Array ? payload : new Uint8Array(payload);
      return new Uint8Array(await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes.slice(0, 12) },
        key,
        bytes.slice(12)
      ));
    }
    <!-- READER_CRYPTO_END -->

    const TOTAL = 260;
    const PUBLIC_PAGES = new Set([52, 53, 54, 55]);
    const isId = new URLSearchParams(location.search).get('lang') === 'id';
    const text = isId
      ? { page: 'Halaman', of: 'dari', go: 'Buka', goLabel: 'Ke halaman', previous: 'Spread sebelumnya', next: 'Spread berikutnya', myPhotos: 'Foto saya', locked: 'Halaman ini terkunci.', motto: 'Petunjuk: motto angkatan kita, 5 kata, bahasa Inggris.', submit: 'Buka buku', checking: 'Memeriksa…', wrong: 'Motto salah, coba lagi.', failed: 'Halaman tidak dapat dimuat.', setup: 'Reader belum siap. Coba lagi nanti.' }
      : { page: 'Page', of: 'of', go: 'Go', goLabel: 'Go to page', previous: 'Previous spread', next: 'Next spread', myPhotos: 'My photos', locked: 'This page is locked.', motto: 'Hint: our class motto, 5 words, in English.', submit: 'Unlock', checking: 'Checking…', wrong: 'Wrong motto, try again.', failed: 'Page could not be loaded.', setup: 'Reader is not ready yet. Please try again later.' };
    document.documentElement.lang = isId ? 'id' : 'en';

    const book = document.getElementById('book');
    const pageStatus = document.getElementById('pageStatus');
    const pageNumber = document.getElementById('pageNumber');
    const previousPage = document.getElementById('previousPage');
    const nextPage = document.getElementById('nextPage');
    const myPhotos = document.getElementById('myPhotos');
    const pageForm = document.getElementById('pageForm');
    const cache = new Map();
    let manifest = null;
    let key = null;
    let page = parsePage(location.hash.slice(1)) || 52;
    let renderId = 0;
    let pointerStart = null;

    function parsePage(value) {
      const number = Number(value);
      return Number.isInteger(number) && number >= 1 && number <= TOTAL ? number : null;
    }

    function base64Bytes(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, character => character.charCodeAt(0));
    }

    function bytesBase64(value) {
      let binary = '';
      for (const byte of value) binary += String.fromCharCode(byte);
      return btoa(binary);
    }

    function validManifest(value) {
      return value && value.v === 1 && value.total === TOTAL &&
        Number.isInteger(value.iter) && value.iter >= 100000 && value.iter <= 500000 &&
        base64Bytes(value.salt).length === 16 && base64Bytes(value.check).length > 28 &&
        JSON.stringify(value.publicPages) === '[52,53,54,55]' &&
        value.plainBase === 'https://res.cloudinary.com/dxccvha88/image/upload/f_auto,q_auto,w_1200/yearbook/' &&
        value.encBase === 'https://res.cloudinary.com/dxccvha88/raw/upload/yearbook-enc/';
    }

    async function loadManifest() {
      const response = await fetch('manifest.json', { cache: 'no-cache' });
      if (!response.ok) throw new Error('manifest');
      const value = await response.json();
      if (!validManifest(value)) throw new Error('manifest');
      manifest = value;
      const saved = sessionStorage.getItem('yearbook:key');
      if (saved) {
        try {
          const imported = await crypto.subtle.importKey('raw', base64Bytes(saved), 'AES-GCM', true, ['decrypt']);
          if (await verifyKey(imported)) key = imported;
          else sessionStorage.removeItem('yearbook:key');
        } catch (_) {
          sessionStorage.removeItem('yearbook:key');
        }
      }
    }

    async function verifyKey(candidate) {
      const clear = await decryptPayload(base64Bytes(manifest.check), candidate);
      return new TextDecoder().decode(clear) === 'yearbook-ok';
    }

    function visiblePages() {
      if (window.matchMedia('(min-width: 700px)').matches && page !== 1) {
        const left = page % 2 === 0 ? page : page - 1;
        return [left, Math.min(left + 1, TOTAL)];
      }
      return [page];
    }

    function displayRange(pages) {
      if (pages.length === 1) return text.page + ' ' + pages[0] + ' ' + text.of + ' ' + TOTAL;
      return text.page + 's ' + pages[0] + '–' + pages[1] + ' ' + text.of + ' ' + TOTAL;
    }

    function pageUrl(number) {
      return manifest.plainBase + String(number).padStart(3, '0');
    }

    function trimCache() {
      while (cache.size > 12) {
        const oldest = cache.keys().next().value;
        URL.revokeObjectURL(cache.get(oldest));
        cache.delete(oldest);
      }
    }

    async function privatePageUrl(number) {
      if (cache.has(number)) {
        const cached = cache.get(number);
        cache.delete(number);
        cache.set(number, cached);
        return cached;
      }
      if (!key) throw new Error('locked');
      const response = await fetch(manifest.encBase + String(number).padStart(3, '0') + '.bin');
      if (!response.ok) throw new Error('page');
      const clear = await decryptPayload(await response.arrayBuffer(), key);
      const url = URL.createObjectURL(new Blob([clear], { type: 'image/webp' }));
      cache.set(number, url);
      trimCache();
      return url;
    }

    function lockPanel() {
      const panel = document.createElement('section');
      panel.className = 'lock-panel';
      const icon = document.createElement('div');
      icon.className = 'lock';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '🔒';
      const message = document.createElement('p');
      message.textContent = text.locked;
      const hint = document.createElement('p');
      hint.textContent = text.motto;
      const form = document.createElement('form');
      const input = document.createElement('input');
      input.type = 'text';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.setAttribute('aria-label', text.motto);
      const button = document.createElement('button');
      button.type = 'submit';
      button.textContent = text.submit;
      const status = document.createElement('p');
      status.className = 'status';
      status.setAttribute('aria-live', 'polite');
      status.setAttribute('role', 'status');
      form.append(input, button, status);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = text.checking;
        try {
          const candidate = await deriveReaderKey(input.value, base64Bytes(manifest.salt), manifest.iter);
          if (!await verifyKey(candidate)) throw new Error('wrong');
          key = candidate;
          try { sessionStorage.setItem('yearbook:key', bytesBase64(new Uint8Array(await crypto.subtle.exportKey('raw', candidate)))); } catch (_) {}
          await render(true);
        } catch (_) {
          status.textContent = text.wrong;
          input.focus();
        } finally {
          button.disabled = false;
        }
      });
      panel.append(icon, message, hint, form);
      return panel;
    }

    async function render(animate = false) {
      const id = ++renderId;
      const pages = visiblePages();
      pageNumber.value = page;
      pageNumber.setAttribute('aria-label', text.goLabel);
      pageStatus.textContent = displayRange(pages);
      previousPage.setAttribute('aria-label', text.previous);
      nextPage.setAttribute('aria-label', text.next);
      myPhotos.textContent = text.myPhotos;
      book.replaceChildren();

      const spread = document.createElement('div');
      spread.className = 'spread ' + (pages.length === 2 ? 'double' : 'single');
      if (animate) spread.classList.add('turning');
      book.appendChild(spread);
      let firstInput = null;

      for (const number of pages) {
        const slot = document.createElement('div');
        slot.className = 'page-slot';
        spread.appendChild(slot);
        if (!PUBLIC_PAGES.has(number) && !key) {
          const panel = lockPanel();
          slot.appendChild(panel);
          if (!firstInput) firstInput = panel.querySelector('input');
          continue;
        }
        const image = document.createElement('img');
        image.alt = (isId ? 'Halaman buku tahunan ' : 'Yearbook page ') + number;
        image.decoding = 'async';
        image.draggable = false;
        slot.appendChild(image);
        try {
          image.src = PUBLIC_PAGES.has(number) ? pageUrl(number) : await privatePageUrl(number);
        } catch (_) {
          if (id !== renderId) return;
          const message = document.createElement('p');
          message.className = 'status';
          message.setAttribute('role', 'status');
          message.setAttribute('aria-live', 'polite');
          message.textContent = text.failed;
          slot.replaceChildren(message);
        }
        if (id !== renderId) return;
      }

      if (firstInput) firstInput.focus({ preventScroll: true });
      previousPage.disabled = page <= 1;
      nextPage.disabled = page >= TOTAL;
      if (!key) {
        for (const number of pages) if (!PUBLIC_PAGES.has(number)) return;
      }
      preloadNeighbours();
    }

    function movePage(delta) {
      const step = window.matchMedia('(min-width: 700px)').matches ? 2 : 1;
      page = Math.max(1, Math.min(TOTAL, page + delta * step));
      history.replaceState(null, '', '#' + page);
      render(true);
    }

    function preloadNeighbours() {
      if (!manifest) return;
      const current = visiblePages();
      for (const number of new Set([...current, current[0] - 1, current.at(-1) + 1])) {
        if (number < 1 || number > TOTAL) continue;
        if (PUBLIC_PAGES.has(number)) {
          const image = new Image();
          image.src = pageUrl(number);
        } else if (key) {
          privatePageUrl(number).catch(() => {});
        }
      }
    }

    pageForm.addEventListener('submit', event => {
      event.preventDefault();
      const value = parsePage(pageNumber.value);
      if (!value) return;
      page = value;
      history.replaceState(null, '', '#' + page);
      render(true);
    });
    previousPage.addEventListener('click', () => movePage(-1));
    nextPage.addEventListener('click', () => movePage(1));
    myPhotos.addEventListener('click', () => {
      page = 54;
      history.replaceState(null, '', '#54');
      render(true);
    });
    document.getElementById('fullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
    });
    document.addEventListener('keydown', event => {
      if (event.target === pageNumber || event.target.matches('input, button')) return;
      if (event.key === 'ArrowLeft') movePage(-1);
      if (event.key === 'ArrowRight') movePage(1);
    });
    book.addEventListener('pointerdown', event => {
      if (event.target.closest('input, button')) return;
      pointerStart = event.clientX;
    });
    book.addEventListener('pointerup', event => {
      if (pointerStart === null) return;
      const delta = event.clientX - pointerStart;
      pointerStart = null;
      if (Math.abs(delta) > 50) movePage(delta < 0 ? 1 : -1);
    });
    book.addEventListener('pointercancel', () => { pointerStart = null; });
    window.addEventListener('hashchange', () => {
      page = parsePage(location.hash.slice(1)) || 52;
      render(true);
    });
    window.matchMedia('(min-width: 700px)').addEventListener('change', () => render());

    loadManifest().then(() => render()).catch(() => {
      pageStatus.textContent = text.setup;
      book.replaceChildren();
    });
  </script>
</body>
</html>
