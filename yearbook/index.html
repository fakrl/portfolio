<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191f">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <title>Batch 19 FENTURAL Yearbook</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 10px; padding: 12px; background: #17191f; color: #f5f5f5; font: 14px/1.4 system-ui, sans-serif; }
    .book { display: grid; grid-template-rows: minmax(0, 1fr); place-items: stretch; min-height: 0; perspective: 1200px; }
    .spread { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); align-items: stretch; gap: 1px; width: 100%; height: 100%; min-height: 0; }
    .spread.double { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .spread.single { max-width: min(100%, 48vh); }
    .page-slot { display: grid; place-items: center; width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; background: #111318; }
    .page-slot img { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 130px); object-fit: contain; box-shadow: 0 8px 32px #0008; }
    .page-slot:empty { background: transparent; }
    .spread.turning { animation: turn 350ms ease both; transform-origin: center; }
    @keyframes turn { from { opacity: .25; transform: rotateY(-7deg); } to { opacity: 1; transform: rotateY(0); } }
    @media (prefers-reduced-motion: reduce) { .spread.turning { animation: fade .15s ease both; } @keyframes fade { from { opacity: .4; } to { opacity: 1; } } }
    .toolbar { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; }
    button, input { min-height: 38px; border: 1px solid #ffffff30; border-radius: 8px; background: #ffffff12; color: inherit; font: inherit; }
    button { padding: 0 12px; cursor: pointer; }
    button:hover:not(:disabled) { background: #ffffff24; }
    button:disabled { opacity: .45; cursor: default; }
    input { width: 5.5em; padding: 0 8px; text-align: center; }
    .lock-panel { width: min(100%, 320px); padding: 20px; text-align: center; }
    .lock-panel .lock { font-size: 1.5rem; }
    .lock-panel p { margin: 8px 0; color: #c8cad2; }
    .lock-panel form { display: grid; gap: 8px; }
    .lock-panel input { width: 100%; text-align: left; }
    .status { min-height: 1.4em; color: #f2c5c5; }
    .status[role="status"] { color: #d3d5de; }
    /* open-book look + page flip (desktop spread) */
    .book { container-type: size; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
    .spread.double { position: relative; display: block; width: min(100cqw, 100cqh * 1.4146); height: auto; aspect-ratio: 2716 / 1920; margin: auto; gap: 0; perspective: 2600px; background: #e9e5dc; border-radius: 3px; box-shadow: 0 22px 60px #000b, 0 0 0 1px #0006; }
    .spread.double .page-slot { position: absolute; top: 0; bottom: 0; width: 50%; height: 100%; background: #e9e5dc; }
    .spread.double .page-slot:nth-child(1) { left: 0; }
    .spread.double .page-slot:nth-child(2) { left: 50%; }
    .spread.double .page-slot img { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; box-shadow: none; }
    .spread.double .page-slot:has(.lock-panel) { background: #111318; }
    .spread.double::after { content: ''; position: absolute; top: 0; bottom: 0; left: calc(50% - 16px); width: 32px; z-index: 3; pointer-events: none; background: linear-gradient(to right, transparent, rgba(0, 0, 0, .26) 50%, transparent); }
    .leaf { position: absolute; top: 0; width: 50%; height: 100%; z-index: 2; transform-style: preserve-3d; will-change: transform; }
    .leaf.fwd { left: 50%; transform-origin: left center; }
    .leaf.back { left: 0; transform-origin: right center; }
    .leaf.anim { transition: transform 680ms cubic-bezier(.45, .05, .25, 1); }
    .leaf .face { position: absolute; inset: 0; overflow: hidden; background: #e9e5dc; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .leaf .face.bk { transform: rotateY(180deg); }
    .leaf .face img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .book .spread.double { cursor: grab; }
    /* intro: closed cover centred on the right half, then the book opens */
    .spread.double.closed { transform: translateX(-25%); background: transparent; box-shadow: none; }
    .spread.double.closed::after { opacity: 0; }
    .spread.double.closed .page-slot:nth-child(1) { opacity: 0; }
    .spread.double.closed .page-slot:nth-child(2) { box-shadow: 0 22px 60px #000b; }
    .spread.double.opening { transition: transform 800ms cubic-bezier(.45, .05, .25, 1), background .8s, box-shadow .8s; }
    .spread.double.opening::after { transition: opacity .8s; }
    .spread.double.opening .page-slot:nth-child(1) { transition: opacity 600ms ease 250ms; }
    .leaf.intro { transition: transform 800ms cubic-bezier(.45, .05, .25, 1), opacity 260ms ease 540ms; box-shadow: 0 22px 60px #000b; }
    .leaf.intro .face.bk { background: #d8d3c8; }
    .spread.double.locked { display: grid; place-items: center; background: #111318; }
    .spread.double.locked::after { opacity: .5; }
    .spread.double.locked .lock-panel { position: relative; z-index: 4; width: min(88%, 340px); padding: 8px; }
    @container (max-width: 420px) { .spread.double.locked .lock-panel { font-size: 11px; } .spread.double.locked .lock-panel .lock { font-size: 1.1rem; } .spread.double.locked .lock-panel p { margin: 3px 0; } .spread.double.locked .lock-panel input, .spread.double.locked .lock-panel button { min-height: 28px; } }
    .pw-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 10px; background: #000a; }
    .pw-card { width: min(100%, 340px); max-height: 100%; overflow: auto; padding: 16px; border: 1px solid #ffffff2a; border-radius: 14px; background: #1d2027; text-align: center; box-shadow: 0 20px 60px #000c; }
    .pw-card .lock { font-size: 1.5rem; }
    .pw-card p { margin: 6px 0; color: #c8cad2; }
    .pw-card .pw-title { color: #f5f5f5; font-weight: 600; }
    .pw-card input { width: 100%; margin-top: 4px; text-align: left; }
    .pw-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .pw-actions .primary { background: #3b6cff; border-color: #3b6cff; }
    :focus-visible { outline: 2px solid #9fc5ff; outline-offset: 2px; }
    @media (min-width: 700px) { .spread.double { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 699px) {
      body { padding: 8px; gap: 6px; }
      .spread.double { grid-template-columns: minmax(0, 1fr); }
      .spread.single { max-width: 100%; }
      .toolbar { gap: 5px; }
      button { padding: 0 9px; }
    }
  </style>
</head>
<body>
  <main class="book" id="book" aria-label="Digital yearbook"></main>
  <form class="toolbar" id="pageForm" aria-label="Yearbook controls">
    <button id="previousPage" type="button" aria-label="Previous spread">←</button>
    <label><span id="pageStatus" aria-live="polite">Loading yearbook…</span>
      <input id="pageNumber" type="number" min="1" max="260" value="54" aria-label="Go to page">
    </label>
    <button id="goPage" type="submit">Go</button>
    <button id="nextPage" type="button" aria-label="Next spread">→</button>
    <button id="fullscreen" type="button" aria-label="Toggle fullscreen">⛶</button>
  </form>
  <script>
    <!-- READER_CRYPTO_START -->
    function normalizeReaderPassword(value) {
      return value.normalize('NFKC').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
    }

    async function deriveReaderKey(password, salt, iterations) {
      const material = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(normalizeReaderPassword(password)),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        true,
        ['decrypt']
      );
    }

    async function decryptPayload(payload, key) {
      const bytes = payload instanceof Uint8Array ? payload : new Uint8Array(payload);
      return new Uint8Array(await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes.slice(0, 12) },
        key,
        bytes.slice(12)
      ));
    }
    <!-- READER_CRYPTO_END -->

    const TOTAL = 260;
    const PUBLIC_PAGES = new Set([1, 52, 53, 54, 55]);
    const isId = new URLSearchParams(location.search).get('lang') === 'id';
    const text = isId
      ? { page: 'Halaman', of: 'dari', go: 'Buka', goLabel: 'Ke halaman', previous: 'Spread sebelumnya', next: 'Spread berikutnya', myPhotos: 'Foto saya', locked: 'Halaman ini terkunci.', motto: 'Petunjuk: motto angkatan kita, 5 kata, bahasa Inggris.', submit: 'Buka buku', cancel: 'Batal', enter: 'Masukkan motto', checking: 'Memeriksa…', wrong: 'Motto salah, coba lagi.', failed: 'Halaman tidak dapat dimuat.', setup: 'Reader belum siap. Coba lagi nanti.' }
      : { page: 'Page', of: 'of', go: 'Go', goLabel: 'Go to page', previous: 'Previous spread', next: 'Next spread', myPhotos: 'My photos', locked: 'This page is locked.', motto: 'Hint: our class motto, 5 words, in English.', submit: 'Unlock', cancel: 'Cancel', enter: 'Enter motto', checking: 'Checking…', wrong: 'Wrong motto, try again.', failed: 'Page could not be loaded.', setup: 'Reader is not ready yet. Please try again later.' };
    document.documentElement.lang = isId ? 'id' : 'en';

    const book = document.getElementById('book');
    const pageStatus = document.getElementById('pageStatus');
    const pageNumber = document.getElementById('pageNumber');
    const previousPage = document.getElementById('previousPage');
    const nextPage = document.getElementById('nextPage');
    const pageForm = document.getElementById('pageForm');
    const cache = new Map();
    let manifest = null;
    let key = null;
    let page = parsePage(location.hash.slice(1)) || 54;
    let renderId = 0;
    // ?intro=1: start as a closed book (the cover) and open it onto the spread
    let introPending = new URLSearchParams(location.search).get('intro') === '1';

    function startIntro(spread) {
      spread.classList.add('closed');
      const leaf = document.createElement('div');
      leaf.className = 'leaf fwd intro';
      const front = document.createElement('div');
      front.className = 'face';
      const cover = new Image();
      cover.alt = ''; cover.draggable = false;
      cover.src = manifest.plainBase + '001';
      front.appendChild(cover);
      const back = document.createElement('div');
      back.className = 'face bk';
      leaf.append(front, back);
      spread.appendChild(leaf);
      setTimeout(() => {
        spread.classList.add('opening');
        spread.classList.remove('closed');
        leaf.style.transform = 'rotateY(-180deg)';
        leaf.style.opacity = '0';
        setTimeout(() => { leaf.remove(); spread.classList.remove('opening'); }, 1000);
      }, 900);
    }
    let pointerStart = null;

    function parsePage(value) {
      const number = Number(value);
      return Number.isInteger(number) && number >= 1 && number <= TOTAL ? number : null;
    }

    function base64Bytes(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, character => character.charCodeAt(0));
    }

    function bytesBase64(value) {
      let binary = '';
      for (const byte of value) binary += String.fromCharCode(byte);
      return btoa(binary);
    }

    function validManifest(value) {
      return value && value.v === 1 && value.total === TOTAL &&
        Number.isInteger(value.iter) && value.iter >= 100000 && value.iter <= 500000 &&
        base64Bytes(value.salt).length === 16 && base64Bytes(value.check).length > 28 &&
        JSON.stringify(value.publicPages) === '[1,52,53,54,55]' &&
        value.plainBase === 'https://res.cloudinary.com/dxccvha88/image/upload/f_auto,q_auto,w_1200/yearbook/' &&
        value.encBase === 'https://res.cloudinary.com/dxccvha88/raw/upload/yearbook-enc/';
    }

    async function loadManifest() {
      const response = await fetch('manifest.json', { cache: 'no-cache' });
      if (!response.ok) throw new Error('manifest');
      const value = await response.json();
      if (!validManifest(value)) throw new Error('manifest');
      manifest = value;
      const saved = sessionStorage.getItem('yearbook:key');
      if (saved) {
        try {
          const imported = await crypto.subtle.importKey('raw', base64Bytes(saved), 'AES-GCM', true, ['decrypt']);
          if (await verifyKey(imported)) key = imported;
          else sessionStorage.removeItem('yearbook:key');
        } catch (_) {
          sessionStorage.removeItem('yearbook:key');
        }
      }
    }

    async function verifyKey(candidate) {
      const clear = await decryptPayload(base64Bytes(manifest.check), candidate);
      return new TextDecoder().decode(clear) === 'yearbook-ok';
    }

    function visiblePages() {
      if (true && page !== 1) {
        const left = page % 2 === 0 ? page : page - 1;
        return [left, Math.min(left + 1, TOTAL)];
      }
      return [page];
    }

    function displayRange(pages) {
      if (pages.length === 1) return text.page + ' ' + pages[0] + ' ' + text.of + ' ' + TOTAL;
      return text.page + 's ' + pages[0] + '–' + pages[1] + ' ' + text.of + ' ' + TOTAL;
    }

    function pageUrl(number) {
      return manifest.plainBase + String(number).padStart(3, '0');
    }

    function trimCache() {
      while (cache.size > 12) {
        const oldest = cache.keys().next().value;
        URL.revokeObjectURL(cache.get(oldest));
        cache.delete(oldest);
      }
    }

    async function privatePageUrl(number) {
      if (cache.has(number)) {
        const cached = cache.get(number);
        cache.delete(number);
        cache.set(number, cached);
        return cached;
      }
      if (!key) throw new Error('locked');
      const response = await fetch(manifest.encBase + String(number).padStart(3, '0'));
      if (!response.ok) throw new Error('page');
      const clear = await decryptPayload(await response.arrayBuffer(), key);
      const url = URL.createObjectURL(new Blob([clear], { type: 'image/webp' }));
      cache.set(number, url);
      trimCache();
      return url;
    }

    let passwordModal = null;

    function askPassword() {
      if (passwordModal) return;
      const overlay = document.createElement('div');
      overlay.className = 'pw-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      const card = document.createElement('form');
      card.className = 'pw-card';
      const icon = document.createElement('div');
      icon.className = 'lock';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '🔒';
      const message = document.createElement('p');
      message.className = 'pw-title';
      message.textContent = text.locked;
      const hint = document.createElement('p');
      hint.textContent = text.motto;
      const input = document.createElement('input');
      input.type = 'text';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.setAttribute('aria-label', text.motto);
      const status = document.createElement('p');
      status.className = 'status';
      status.setAttribute('aria-live', 'polite');
      status.setAttribute('role', 'status');
      const row = document.createElement('div');
      row.className = 'pw-actions';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.textContent = text.cancel;
      const button = document.createElement('button');
      button.type = 'submit';
      button.className = 'primary';
      button.textContent = text.submit;
      row.append(cancel, button);
      card.append(icon, message, hint, input, status, row);
      overlay.appendChild(card);
      const close = () => {
        passwordModal = null;
        document.removeEventListener('keydown', onKey, true);
        overlay.remove();
      };
      const onKey = event => { if (event.key === 'Escape') { event.stopPropagation(); close(); } };
      document.addEventListener('keydown', onKey, true);
      cancel.addEventListener('click', close);
      overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
      card.addEventListener('submit', async event => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = text.checking;
        try {
          const candidate = await deriveReaderKey(input.value, base64Bytes(manifest.salt), manifest.iter);
          if (!await verifyKey(candidate)) throw new Error('wrong');
          key = candidate;
          try { sessionStorage.setItem('yearbook:key', bytesBase64(new Uint8Array(await crypto.subtle.exportKey('raw', candidate)))); } catch (_) {}
          close();
          await render(true);
        } catch (_) {
          status.textContent = text.wrong;
          input.focus();
          button.disabled = false;
        }
      });
      passwordModal = overlay;
      document.body.appendChild(overlay);
      input.focus();
    }

    // the page itself only shows a locked placeholder; the password is asked in a popup
    function lockPanel() {
      const panel = document.createElement('section');
      panel.className = 'lock-panel';
      const icon = document.createElement('div');
      icon.className = 'lock';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '🔒';
      const message = document.createElement('p');
      message.textContent = text.locked;
      const open = document.createElement('button');
      open.type = 'button';
      open.textContent = text.enter;
      open.addEventListener('click', askPassword);
      panel.append(icon, message, open);
      return panel;
    }

    async function render(animate = false) {
      const id = ++renderId;
      flipping = false;
      const pages = visiblePages();
      pageNumber.value = page;
      pageNumber.setAttribute('aria-label', text.goLabel);
      pageStatus.textContent = displayRange(pages);
      previousPage.setAttribute('aria-label', text.previous);
      nextPage.setAttribute('aria-label', text.next);
      book.replaceChildren();

      const spread = document.createElement('div');
      spread.className = 'spread ' + (pages.length === 2 ? 'double' : 'single');
      if (animate) spread.classList.add('turning');
      book.appendChild(spread);
      if (introPending && pages.length === 2 && !reduceMotion.matches) { introPending = false; startIntro(spread); }
      let firstInput = null;

      // a fully locked spread gets one panel across both pages instead of two cramped ones
      if (pages.length === 2 && !key && pages.every(n => !PUBLIC_PAGES.has(n))) {
        spread.classList.add('locked');
        const panel = lockPanel();
        spread.appendChild(panel);
        firstInput = panel.querySelector('button');
        askPassword();
        previousPage.disabled = page <= 1;
        nextPage.disabled = page >= TOTAL;
        return;
      }

      for (const number of pages) {
        const slot = document.createElement('div');
        slot.className = 'page-slot';
        spread.appendChild(slot);
        if (!PUBLIC_PAGES.has(number) && !key) {
          const panel = lockPanel();
          slot.appendChild(panel);
          if (!firstInput) firstInput = panel.querySelector('button');
          continue;
        }
        const image = document.createElement('img');
        image.alt = (isId ? 'Halaman buku tahunan ' : 'Yearbook page ') + number;
        image.decoding = 'async';
        image.draggable = false;
        slot.appendChild(image);
        try {
          image.src = PUBLIC_PAGES.has(number) ? pageUrl(number) : await privatePageUrl(number);
        } catch (_) {
          if (id !== renderId) return;
          const message = document.createElement('p');
          message.className = 'status';
          message.setAttribute('role', 'status');
          message.setAttribute('aria-live', 'polite');
          message.textContent = text.failed;
          slot.replaceChildren(message);
        }
        if (id !== renderId) return;
      }

      if (firstInput) askPassword();
      previousPage.disabled = page <= 1;
      nextPage.disabled = page >= TOTAL;
      if (!key) {
        for (const number of pages) if (!PUBLIC_PAGES.has(number)) return;
      }
      preloadNeighbours();
    }

    // ---- page flip (desktop spread): one leaf rotates around the spine ----
    let flipping = false;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function updateChrome() {
      pageNumber.value = page;
      pageStatus.textContent = displayRange(visiblePages());
      previousPage.disabled = page <= 1;
      nextPage.disabled = page >= TOTAL;
    }

    function srcFor(number) {
      return PUBLIC_PAGES.has(number) ? Promise.resolve(pageUrl(number)) : privatePageUrl(number);
    }

    async function decoded(url) {
      const image = new Image();
      image.src = url;
      try { await image.decode(); } catch (_) {}
      return url;
    }

    function flipPlan(dir) {
      if (flipping || reduceMotion.matches) return null;
      const spread = book.querySelector('.spread.double');
      if (!spread || spread.querySelectorAll('.page-slot > img').length !== 2) return null;
      const current = visiblePages();
      if (current.length !== 2) return null;
      const left = current[0] + dir * 2;
      if (left < 2 || left + 1 > TOTAL) return null;
      const target = [left, left + 1];
      if (![...current, ...target].every(n => PUBLIC_PAGES.has(n) || key)) return null;
      return { current, target, spread };
    }

    async function prepareFlip(dir, plan) {
      const { current, target, spread } = plan;
      const slots = spread.querySelectorAll('.page-slot');
      const need = dir > 0 ? [current[1], target[0], target[1]] : [current[0], target[1], target[0]];
      const urls = await Promise.all(need.map(async n => decoded(await srcFor(n))));
      const face = (url, back) => {
        const box = document.createElement('div');
        box.className = 'face' + (back ? ' bk' : '');
        const image = new Image();
        image.src = url; image.alt = ''; image.draggable = false;
        box.appendChild(image);
        return box;
      };
      const leaf = document.createElement('div');
      leaf.className = 'leaf ' + (dir > 0 ? 'fwd' : 'back');
      leaf.append(face(urls[0], false), face(urls[1], true));
      // the page that will be uncovered goes under the leaf right away
      slots[dir > 0 ? 1 : 0].querySelector('img').src = urls[2];
      spread.appendChild(leaf);
      return { spread, slots, leaf, dir, plan, urls };
    }

    function finishFlip(ctx, complete) {
      return new Promise(resolve => {
        const { leaf, dir, slots, plan, urls } = ctx;
        leaf.getBoundingClientRect();
        leaf.classList.add('anim');
        leaf.style.transform = complete ? 'rotateY(' + (dir > 0 ? -180 : 180) + 'deg)' : 'rotateY(0deg)';
        let done = false;
        const end = async () => {
          if (done) return;
          done = true;
          const keepSlot = slots[dir > 0 ? 0 : 1].querySelector('img');
          const underSlot = slots[dir > 0 ? 1 : 0].querySelector('img');
          if (complete) {
            keepSlot.src = urls[1];
            try { await keepSlot.decode(); } catch (_) {}
            page = plan.target[0];
            try { history.replaceState(null, '', '#' + page); } catch (_) {}
            updateChrome();
          } else {
            underSlot.src = urls[0];
            try { await underSlot.decode(); } catch (_) {}
          }
          leaf.remove();
          flipping = false;
          resolve(complete);
          if (complete) preloadNeighbours();
        };
        leaf.addEventListener('transitionend', end, { once: true });
        setTimeout(end, 900);
      });
    }

    async function movePage(delta) {
      const plan = flipPlan(delta);
      if (plan) {
        flipping = true;
        try {
          await finishFlip(await prepareFlip(delta, plan), true);
        } catch (_) {
          flipping = false;
          render(true);
        }
        return;
      }
      if (flipping) return;
      const step = true ? 2 : 1;
      page = Math.max(1, Math.min(TOTAL, page + delta * step));
      try { history.replaceState(null, '', '#' + page); } catch (_) {}
      render(true);
    }

    function preloadNeighbours() {
      if (!manifest) return;
      const current = visiblePages();
      for (const number of new Set([...current, current[0] - 1, current.at(-1) + 1])) {
        if (number < 1 || number > TOTAL) continue;
        if (PUBLIC_PAGES.has(number)) {
          const image = new Image();
          image.src = pageUrl(number);
        } else if (key) {
          privatePageUrl(number).catch(() => {});
        }
      }
    }

    pageForm.addEventListener('submit', event => {
      event.preventDefault();
      const value = parsePage(pageNumber.value);
      if (!value) return;
      page = value;
      history.replaceState(null, '', '#' + page);
      render(true);
    });
    previousPage.addEventListener('click', () => movePage(-1));
    nextPage.addEventListener('click', () => movePage(1));
    document.getElementById('fullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
    });
    document.addEventListener('keydown', event => {
      if (event.target === pageNumber || event.target.matches('input, button')) return;
      if (event.key === 'ArrowLeft') movePage(-1);
      if (event.key === 'ArrowRight') movePage(1);
    });
    // drag a page corner like a real book; a tap on the left/right half also turns the page
    let drag = null;
    function applyDrag() {
      if (!drag || !drag.ctx) return;
      const width = drag.ctx.spread.getBoundingClientRect().width;
      const signed = drag.dx * (drag.dir > 0 ? -1 : 1);
      drag.p = Math.max(0, Math.min(1, signed / (width * 0.6)));
      drag.ctx.leaf.style.transform = 'rotateY(' + (drag.dir > 0 ? -180 : 180) * drag.p + 'deg)';
    }
    book.addEventListener('pointerdown', event => {
      if (event.button > 0 || flipping || event.target.closest('input, button, form')) return;
      drag = { x: event.clientX, y: event.clientY, t: performance.now(), dx: 0, dir: 0, p: 0, ctx: null, prep: null, simple: false };
    });
    book.addEventListener('pointermove', event => {
      if (!drag) return;
      drag.dx = event.clientX - drag.x;
      if (!drag.dir) {
        if (Math.abs(drag.dx) < 10) return;
        drag.dir = drag.dx < 0 ? 1 : -1;
        const plan = flipPlan(drag.dir);
        if (!plan) { drag.simple = true; return; }
        flipping = true;
        try { book.setPointerCapture(event.pointerId); } catch (_) {}
        const current = drag;
        current.prep = prepareFlip(current.dir, plan).then(ctx => { current.ctx = ctx; applyDrag(); return ctx; })
          .catch(() => { flipping = false; if (drag === current) drag = null; render(true); return null; });
        return;
      }
      applyDrag();
    });
    async function endDrag(event, cancelled) {
      const current = drag;
      drag = null;
      if (!current) return;
      if (current.prep) {
        const ctx = current.ctx || await current.prep;
        if (!ctx) return;
        const quick = performance.now() - current.t < 350 && current.p > 0.08;
        await finishFlip(ctx, !cancelled && (current.p > 0.3 || quick));
        return;
      }
      if (cancelled) return;
      if (current.simple) { movePage(current.dir); return; }
      if (Math.abs(event.clientX - current.x) < 8 && Math.abs(event.clientY - current.y) < 8 && !event.target.closest('input, button, form')) {
        const box = book.getBoundingClientRect();
        movePage(event.clientX < box.left + box.width / 2 ? -1 : 1);
      }
    }
    book.addEventListener('pointerup', event => endDrag(event, false));
    book.addEventListener('pointercancel', event => endDrag(event, true));
    window.addEventListener('hashchange', () => {
      page = parsePage(location.hash.slice(1)) || 54;
      render(true);
    });


    loadManifest().then(() => render()).catch(() => {
      pageStatus.textContent = text.setup;
      book.replaceChildren();
    });
  </script>
</body>
</html>
