<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Untuk Ami">
  <title>for Ami</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <style>
    /* ===== Material 3 layer ===== */
    :root{
      --m3-standard: cubic-bezier(0.2, 0, 0, 1);
      --m3-decelerate: cubic-bezier(0, 0, 0, 1);
      --m3-short: 150ms; --m3-medium: 250ms; --m3-long: 400ms;
    }
    .msym{
      font-family:'Material Symbols Rounded';
      font-weight:normal; font-style:normal; line-height:1;
      letter-spacing:normal; text-transform:none; white-space:nowrap;
      direction:ltr; display:inline-block; -webkit-font-smoothing:antialiased;
      font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;
      vertical-align:-0.18em; user-select:none;
    }
    .msym.outlined{ font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    /* jantung berdenyut buat momen reveal */
    .msym.heartbeat{ animation: m3heart 1.15s var(--m3-standard) infinite; transform-origin:center; }
    @keyframes m3heart{
      0%,100%{ transform:scale(1); }
      14%{ transform:scale(1.22); }
      28%{ transform:scale(1); }
      42%{ transform:scale(1.16); }
      56%{ transform:scale(1); }
    }
    /* ikon meme muncul dengan spring kecil */
    .msym.pop{ animation: m3pop var(--m3-medium) var(--m3-decelerate) both; }
    @keyframes m3pop{ from{ transform:scale(0.5); opacity:0; } to{ transform:scale(1); opacity:1; } }
    @media (prefers-reduced-motion: reduce){
      .msym.heartbeat, .msym.pop{ animation:none; }
    }

    /* ==========================================
       CSS VARIABLES & RESET
       ========================================== */
    :root {
      --bg: #0a0a0a;
      --fg: #f0f0f0;
      --muted: #888;
      --accent: rgba(255, 255, 255, 0.85);
      --accent-glow: rgba(255, 255, 255, 0.35);
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.08);
      --glass: rgba(255,255,255,0.04);
      --glass-strong: rgba(255,255,255,0.08);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.3s ease;
      --transition-fast: 0.15s ease;
      --font-ui: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }

    /* ==========================================
       FULLSCREEN CANVAS LAYER
       ========================================== */
    #mainCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* ==========================================
       UI OVERLAYS (on top of canvas)
       ========================================== */
    .ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .ui-layer > * { pointer-events: auto; }

    .screen {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all var(--transition);
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .screen.hidden { display: none; }

    /* ==========================================
       COUNTDOWN OVERLAY (for photo capture)
       ========================================== */
    .countdown-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition);
    }

    .countdown-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .countdown-number {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      color: white;
      text-shadow: 0 0 60px var(--accent-glow);
      animation: countdownPop 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes countdownPop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ==========================================
       GESTURE PROGRESS BAR (floating during camera)
       ========================================== */
    .gesture-hud {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      max-width: 90vw;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      z-index: 50;
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(20px);
      transition: all var(--transition);
      pointer-events: none;
    }

    .gesture-hud.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .gesture-progress {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .gesture-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,255,255,0.55), rgba(255,255,255,0.95));
      border-radius: 2px;
      transition: width 0.05s linear;
    }

    /* ==========================================
       HINT BOX (small text pill, reused by reveal screen etc.)
       ========================================== */
    .hint-box {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      background: var(--glass);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    /* ==========================================
       MEME POPUP (gesture-triggered fun aside)
       ========================================== */
    .meme-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      z-index: 60;
      background: rgba(10,10,10,0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 2rem;
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
      max-width: 80vw;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--transition), visibility var(--transition), transform var(--transition);
    }

    .meme-popup.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ==========================================
       REVEAL SCREEN
       ========================================== */
    #revealScreen {
      justify-content: center;
      overflow: hidden;
    }

    .reveal-container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .reveal-message {
      font-family: var(--font-display);
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(20px);
      animation: revealUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes revealUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .reveal-message .line { display: block; }
    .reveal-message .line:nth-child(2) { animation-delay: 0.15s; }
    .reveal-message .line:nth-child(3) { animation-delay: 0.3s; }

    .reveal-heart {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.5));
      clip-path: polygon(50% 90%, 10% 40%, 0 50%, 50% 100%, 100% 50%, 90% 40%);
      animation: heartBeat 1.2s ease-in-out infinite;
      box-shadow: 0 0 30px var(--accent-glow);
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
      60% { transform: scale(1); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      animation: particleFloat 3s ease-out forwards;
    }

    @keyframes particleFloat {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }

    /* ==========================================
       RECORDING INDICATOR
       ========================================== */
    .rec-indicator {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-fast);
    }

    .rec-indicator.active { opacity: 1; }

    .rec-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: recPulse 1s ease-in-out infinite;
    }

    @keyframes recPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .rec-time { font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 0.9rem; }

    /* ==========================================
       LOADING OVERLAY
       ========================================== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 1000;
      opacity: 1;
      visibility: visible;
      transition: opacity var(--transition), visibility var(--transition);
    }

    .loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 0.9rem; color: var(--muted); }

    /* ==========================================
       INSTRUCTION TOAST (subtle, top)
       ========================================== */
    .instruction-toast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(10,10,10,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      max-width: 90vw;
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition);
      pointer-events: none;
    }

    .instruction-toast.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================
       RESPONSIVE
       ========================================== */
    @media (max-width: 480px) {
      :root { --radius: 14px; }
      .screen { padding: 1rem; }
      .gesture-hud { width: 90vw; bottom: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- ==========================================
       MAIN CANVAS (composited video + fog + shatter — everything
       drawn on ONE canvas, including hand cursor dots, so the
       whole scene can be recorded via canvas.captureStream)
       ========================================== -->
  <canvas id="mainCanvas"></canvas>

  <!-- ==========================================
       VIDEO ELEMENT (feeds canvas; kept off-screen rather than
       display:none, since Chrome throttles frame decoding on
       display:none video elements)
       ========================================== -->
  <video id="videoInput" autoplay playsinline muted style="position:fixed; top:0; left:-9999px; width:1px; height:1px;"></video>

  <!-- ==========================================
       LOADING OVERLAY
       ========================================== -->
  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text" id="loadingText">Memuat...</p>
  </div>

  <!-- ==========================================
       INSTRUCTION TOAST (subtle, top)
       ========================================== -->
  <div class="instruction-toast" id="instructionToast">
    <span id="toastText">Menginisialisasi kamera...</span>
  </div>

  <!-- ==========================================
       COUNTDOWN OVERLAY (for photo capture)
       ========================================== -->
  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-number" id="countdownNumber">3</div>
  </div>

  <!-- ==========================================
       GESTURE HUD (progress bar during hold — no label text,
       so it doesn't spoil which gesture does what)
       ========================================== -->
  <div class="gesture-hud" id="gestureHud">
    <div class="gesture-progress">
      <div class="gesture-progress-bar" id="hudProgress"></div>
    </div>
  </div>

  <!-- ==========================================
       MEME POPUP (thumbs_up / point_up / rock during the fog step)
       ========================================== -->
  <div class="meme-popup" id="memePopup" aria-live="polite">
    <span id="memeText"></span>
  </div>

  <!-- ==========================================
       REVEAL SCREEN (shown after a still pinch-hold — a little
       finger heart — during the fog step)
       ========================================== -->
  <div class="ui-layer">
    <div class="screen" id="revealScreen" role="region" aria-label="Pesan Spesial">
      <div class="particles" id="particles" aria-hidden="true"></div>
      <div class="reveal-container">
        <div class="reveal-message" id="revealMessage">
          <span class="line">Ami,</span>
          <span class="line">kamu bikin hari-hari jadi lebih berwarna</span>
          <span class="line"><span class="msym heartbeat" style="font-size:1.05em">favorite</span> Mau nggak jadi pacarku?</span>
        </div>
        <div class="reveal-heart" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       RECORDING INDICATOR
       ========================================== -->
  <div class="rec-indicator" id="recIndicator" aria-hidden="true" role="status" aria-live="polite">
    <span class="rec-dot"></span>
    <span class="rec-time" id="recTime">00:00</span>
  </div>

  <!-- ==========================================
       HIDDEN ELEMENTS
       ========================================== -->
  <canvas id="fogMaskCanvas" style="display:none"></canvas>
  <audio id="bgMusic" preload="auto" loop style="display:none"></audio>

  <!-- ==========================================
       MAIN SCRIPT (ES module — Tasks Vision HandLandmarker needs
       the `import` syntax)
       ========================================== -->
  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker,
    } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

    // ==========================================
    // CONFIGURATION
    // ==========================================
    const CONFIG = {
      // Hand tracking model (GPU delegate w/ automatic CPU fallback)
      WASM_BASE_URL: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm',
      HAND_MODEL_URL: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      MODEL_LOAD_TIMEOUT_MS: 20000,

      // Throttle render loop
      FRAME_INTERVAL: 1000 / 30,

      // Gesture hold times
      GESTURE_HOLD_MS: 1000, // single-hand gesture holds (peace/thumbs_up/point_up/rock/open_palm/still-pinch)
      FRAME_HOLD_MS: 500,    // two-hand pinch-frame hold before the photo countdown

      // Pinch geometry (thumb tip to index tip, normalized 0-1)
      PINCH_THRESHOLD: 0.06,
      PINCH_MOVE_THRESHOLD: 0.035, // movement since anchor that counts as "wiping" instead of "holding still"

      // Delay before auto-retrying camera/mic permission after a denial
      PERM_RETRY_DELAY_MS: 4000,

      // Recording
      RECORDING_MAX_SECONDS: 180,

      // Music
      musicUrl: 'music.mp3',

      // Reveal message
      messageLines: [
        'Ami,',
        'kamu bikin hari-hari jadi lebih berwarna',
        '<span class="msym heartbeat">favorite</span> Mau nggak jadi pacarku?'
      ],

      // Meme pop-up texts during the fog step, one pool per gesture so
      // each gesture can have its own vibe. Fill in point_up/rock later —
      // showMeme() falls back to thumbs_up's pool if a pool is empty.
      memePools: {
        thumbs_up: [
          '<span class="msym pop">sentiment_very_satisfied</span> eh ketauan senyum-senyum sendiri',
          '<span class="msym pop">sentiment_satisfied</span> gemesin banget sih, keterlaluan',
          '<span class="msym pop">mood</span> muka lagi jelek juga tetep bikin baper',
          '<span class="msym pop">emoji_emotions</span> awas ih, jangan gemesin gitu terus',
          '<span class="msym pop">auto_awesome</span> udah cantik, sombong lagi',
          '<span class="msym pop">favorite</span> jujur deh, foto ini bakal jadi wallpaper kan?'
        ],
        point_up: [],
        rock: [],
      },
      MEME_DURATION_MS: 2500,

      // Photobooth filter applied to the captured photo (grayscale +
      // contrast/brightness + a little grain)
      PHOTOBOOTH_CONTRAST_ALPHA: 1.3,
      PHOTOBOOTH_BRIGHTNESS_BETA: 10,
      PHOTOBOOTH_NOISE_STD: 15,

      // Shatter transition after a photo is captured
      SHATTER_COLS: 6,
      SHATTER_ROWS: 6,
      SHATTER_DURATION_MS: 850,

      // Breath-fog (mic) — reuses the same mic track already granted for
      // the reaction recording, no extra permission prompt
      BREATH_HIGHPASS_HZ: 800,
      BREATH_RMS_THRESHOLD: 0.014,
      BREATH_COOLDOWN_FRAMES: 4,
    };

    // ==========================================
    // RUNTIME MIME TYPE DETECTION (iOS Safari fix)
    // ==========================================
    function detectVideoMimeType() {
      // Codecs list audio explicitly (opus/mp4a) — a bare "video/webm" or
      // "video/mp4" leaves the audio codec unspecified and some browsers
      // silently record video-only when the audio track was added
      // separately (as ours is, via captureStream + getUserMedia audio).
      const candidates = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/webm;codecs=opus',
        'video/webm',
        'video/mp4'
      ];
      for (const mime of candidates) {
        if (MediaRecorder.isTypeSupported(mime)) return mime;
      }
      return ''; // browser default
    }

    // ==========================================
    // STATE
    // ==========================================
    const state = {
      // Flow
      currentStep: 'loading', // loading -> camera -> photo -> fog -> reveal

      // Media
      stream: null,
      video: null,
      videoWidth: 0,
      videoHeight: 0,
      canvas: null,
      ctx: null,
      animationId: null,
      lastFrameTime: 0,

      // Hand tracking
      handLandmarker: null,
      handsLoadError: null,
      allHands: [],    // this frame's per-hand landmark arrays (0-2 hands)
      landmarks: null, // primary hand (hand 0) landmarks, for single-hand gestures
      indexTip: null,  // {x, y} normalized 0-1, primary hand

      // Single-hand gesture hold/confirm state machine
      gestureState: 'none', // none -> detecting -> holding -> confirmed
      gestureType: null, // 'open_palm' | 'peace' | 'thumbs_up' | 'point_up' | 'rock' | 'pinch'
      gestureStartTime: 0,
      gestureDebounceFrames: 0,
      gestureDebounceRequired: 3,
      pinchAnchor: null, // {x,y} normalized — moving away from this while pinching counts as wiping, not holding

      // Two-hand pinch-frame (photo capture trigger)
      frameHoldStart: null,
      frameBox: null, // {x1,y1,x2,y2,progress} in canvas pixels, drawn as corner brackets

      // Photo countdown
      countdownActive: false,

      // Shatter transition (after a photo is captured)
      shatterActive: false,
      shatterStartedAt: 0,
      shatterFragments: [],

      // Meme popup
      memeTimer: null,

      // Fog (breath-mirror mechanic)
      fogCanvas: null,
      fogCtx: null,
      fogReady: false,
      breathCooldown: 0,
      audioCtx: null,
      wipeTrail: [],
      wipeSmoothX: null,
      wipeSmoothY: null,

      // Recording
      mediaRecorder: null,
      recordedChunks: [],
      recordingStartTime: 0,
      recordingTimer: null,
      videoMimeType: '',
      recordingBlobUrl: null,
      recordingFileName: '',

      // Canvas size
      canvasWidth: 0,
      canvasHeight: 0,
    };

    // ==========================================
    // DOM ELEMENTS
    // ==========================================
    const els = {
      // Screens
      revealScreen: document.getElementById('revealScreen'),

      // Overlays
      loadingOverlay: document.getElementById('loadingOverlay'),
      loadingText: document.getElementById('loadingText'),
      instructionToast: document.getElementById('instructionToast'),
      toastText: document.getElementById('toastText'),
      countdownOverlay: document.getElementById('countdownOverlay'),
      countdownNumber: document.getElementById('countdownNumber'),
      gestureHud: document.getElementById('gestureHud'),
      hudProgress: document.getElementById('hudProgress'),
      memePopup: document.getElementById('memePopup'),
      memeText: document.getElementById('memeText'),
      particles: document.getElementById('particles'),

      // Reveal
      revealMessage: document.getElementById('revealMessage'),

      // Recording
      recIndicator: document.getElementById('recIndicator'),
      recTime: document.getElementById('recTime'),

      // Hidden
      videoInput: document.getElementById('videoInput'),
      mainCanvas: document.getElementById('mainCanvas'),
      fogMaskCanvas: document.getElementById('fogMaskCanvas'),
      bgMusic: document.getElementById('bgMusic'),
    };

    // ==========================================
    // UTILITIES
    // ==========================================
    function debug(msg) {
      console.log('[debug]', msg);
    }

    function showRevealScreen() {
      els.revealScreen.classList.remove('hidden');
      requestAnimationFrame(() => els.revealScreen.classList.add('active'));
      state.currentStep = 'reveal';
    }

    function showToast(text, duration = 4000) {
      els.toastText.innerHTML = text;   // sumber: string hardcoded di CONFIG, bukan input user
      els.instructionToast.classList.add('active');
      if (duration > 0) {
        setTimeout(() => els.instructionToast.classList.remove('active'), duration);
      }
    }

    function updateLoadingText(text) {
      els.loadingText.textContent = text;
    }

    function hideLoading() {
      els.loadingOverlay.classList.add('hidden');
    }

    function showLoading(text = 'Memuat...') {
      updateLoadingText(text);
      els.loadingOverlay.classList.remove('hidden');
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function createParticles(count = 40) {
      const container = els.particles;
      container.innerHTML = '';
      const colors = ['#fff', 'rgba(255,255,255,0.8)', 'rgba(255,255,255,0.6)', 'rgba(255,255,255,0.4)'];

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 8 + 4;
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight * 0.5 + window.innerHeight * 0.3;
        const tx = (Math.random() - 0.5) * 300;
        const ty = -Math.random() * 400 - 100;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const delay = Math.random() * 0.5;

        p.style.cssText = `
          left: ${x}px;
          top: ${y}px;
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          --tx: ${tx}px;
          --ty: ${ty}px;
          animation-delay: ${delay}s;
        `;
        container.appendChild(p);
      }
    }

    // ==========================================
    // MUSIC HANDLING
    // ==========================================
    function initMusic() {
      const audio = els.bgMusic;
      audio.src = CONFIG.musicUrl;
      audio.volume = 0.4;
      audio.loop = false; // play through once, like background music, not looping forever

      // Best-effort: if a real click/touch ever lands on the page (nothing
      // in this gesture-only flow guarantees one), priming play()+pause()
      // during it unlocks autoplay for the later gesture-triggered play().
      function primeAudio() {
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
        }).catch(() => {});
        document.removeEventListener('click', primeAudio);
        document.removeEventListener('touchstart', primeAudio);
      }

      document.addEventListener('click', primeAudio, { once: true });
      document.addEventListener('touchstart', primeAudio, { once: true });

      audio.addEventListener('error', (e) => {
        console.warn('Music load error:', e);
      });
    }

    function playMusic() {
      // No button/real click ever happens in this gesture-only flow, so the
      // usual "prime on first click" autoplay-unlock trick never fires.
      // Just try directly; browsers that allow it will play, strict ones
      // will silently reject and we've lost nothing by trying.
      els.bgMusic.currentTime = 0;
      els.bgMusic.play().catch((err) => console.warn('Music play blocked:', err));
    }

    function stopMusic() {
      els.bgMusic.pause();
      els.bgMusic.currentTime = 0;
    }

    // ==========================================
    // HAND TRACKING — MediaPipe Tasks Vision, GPU delegate w/ CPU fallback
    // ==========================================
    function withTimeout(promise, ms, message) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), ms);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    async function initHandLandmarker() {
      const vision = await withTimeout(
        FilesetResolver.forVisionTasks(CONFIG.WASM_BASE_URL),
        CONFIG.MODEL_LOAD_TIMEOUT_MS,
        'Timeout loading MediaPipe WASM runtime'
      );

      try {
        return await withTimeout(
          HandLandmarker.createFromOptions(vision, {
            baseOptions: { modelAssetPath: CONFIG.HAND_MODEL_URL, delegate: 'GPU' },
            runningMode: 'video',
            numHands: 2,
            minHandDetectionConfidence: 0.6,
            minHandPresenceConfidence: 0.6,
            minTrackingConfidence: 0.6,
          }),
          CONFIG.MODEL_LOAD_TIMEOUT_MS,
          'Timeout loading hand model (GPU)'
        );
      } catch (gpuErr) {
        console.warn('[for-ami] HandLandmarker GPU delegate failed, falling back to CPU', gpuErr);
      }

      return withTimeout(
        HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: CONFIG.HAND_MODEL_URL, delegate: 'CPU' },
          runningMode: 'video',
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minHandPresenceConfidence: 0.6,
          minTrackingConfidence: 0.6,
        }),
        CONFIG.MODEL_LOAD_TIMEOUT_MS,
        'Timeout loading hand model (CPU)'
      );
    }

    async function initMediaPipe() {
      showLoading('Memuat model AI...');
      try {
        state.handLandmarker = await initHandLandmarker();
        hideLoading();
        return true;
      } catch (err) {
        console.error('HandLandmarker init error:', err);
        hideLoading();
        state.handsLoadError = err?.message || String(err);
        debug('Hand model failed: ' + state.handsLoadError);
        return false;
      }
    }

    // ==========================================
    // PER-FRAME HAND PROCESSING
    // ==========================================
    function processHands(result) {
      const handsLm = result.landmarks || [];
      state.allHands = handsLm;

      if (handsLm.length === 0) {
        state.landmarks = null;
        state.indexTip = null;
        resetGestureProgress();
        resetFrameHold();
        return;
      }

      state.landmarks = handsLm[0];
      const tip = state.landmarks[8];
      state.indexTip = { x: tip.x, y: tip.y };

      if (state.currentStep === 'camera' && !state.countdownActive && handsLm.length === 2) {
        handleTwoHandFrame(handsLm[0], handsLm[1]);
      } else {
        resetFrameHold();
      }

      detectGestures(state.landmarks);
    }

    // ==========================================
    // GESTURE SHAPE HELPERS
    // ==========================================
    function computeFingersExtended(landmarks) {
      const tips = [4, 8, 12, 16, 20];
      const pips = [3, 6, 10, 14, 18];
      const extended = [];
      for (let i = 0; i < 5; i++) {
        if (i === 0) {
          // Thumb: extended if the tip sits farther from the pinky-side of
          // the palm (landmark 17) than the thumb's own base joint does.
          // Distance-based so it works regardless of left/right hand or
          // how the hand is rotated toward the camera.
          const tip = landmarks[4], base = landmarks[2], pinkyMcp = landmarks[17];
          const dTip = Math.hypot(tip.x - pinkyMcp.x, tip.y - pinkyMcp.y);
          const dBase = Math.hypot(base.x - pinkyMcp.x, base.y - pinkyMcp.y);
          extended.push(dTip > dBase);
        } else {
          // Other fingers: tip.y < pip.y means extended (pointing up)
          extended.push(landmarks[tips[i]].y < landmarks[pips[i]].y);
        }
      }
      return extended;
    }

    function isPinchShape(landmarks) {
      const thumbTip = landmarks[4], indexTip = landmarks[8];
      const dist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
      const extended = computeFingersExtended(landmarks);
      return dist < CONFIG.PINCH_THRESHOLD && !extended[2] && !extended[3] && !extended[4];
    }

    // ==========================================
    // TWO-HAND PINCH FRAME (photo capture trigger)
    // ==========================================
    function handleTwoHandFrame(lm1, lm2) {
      if (isPinchShape(lm1) && isPinchShape(lm2)) {
        const now = Date.now();
        if (!state.frameHoldStart) state.frameHoldStart = now;
        const progress = Math.min((now - state.frameHoldStart) / CONFIG.FRAME_HOLD_MS, 1);

        const x1 = (1 - lm1[8].x) * state.canvasWidth, y1 = lm1[8].y * state.canvasHeight;
        const x2 = (1 - lm2[8].x) * state.canvasWidth, y2 = lm2[8].y * state.canvasHeight;
        state.frameBox = {
          x1: Math.min(x1, x2), y1: Math.min(y1, y2),
          x2: Math.max(x1, x2), y2: Math.max(y1, y2),
          progress
        };

        updateGestureHUD('frame', progress);

        if (progress >= 1) {
          state.frameHoldStart = null;
          state.frameBox = null;
          els.gestureHud.classList.remove('active');
          triggerPhotoCountdown();
        }
      } else {
        resetFrameHold();
      }
    }

    function resetFrameHold() {
      if (state.frameHoldStart) els.gestureHud.classList.remove('active');
      state.frameHoldStart = null;
      state.frameBox = null;
    }

    // ==========================================
    // SINGLE-HAND GESTURE DETECTION
    // ==========================================
    function detectGestures(landmarks) {
      const fingersExtended = computeFingersExtended(landmarks);

      // OPEN PALM: all 5 fingers extended
      const isOpenPalm = fingersExtended.every(f => f);

      // PEACE: index(1) + middle(2) extended, ring(3) + pinky(4) folded, thumb ignored
      const isPeace = fingersExtended[1] && fingersExtended[2] && !fingersExtended[3] && !fingersExtended[4];

      // THUMBS UP: thumb extended, others folded
      const isThumbsUp = fingersExtended[0] && !fingersExtended[1] && !fingersExtended[2] && !fingersExtended[3] && !fingersExtended[4];

      // POINT UP: only index extended
      const isPointUp = fingersExtended[1] && !fingersExtended[0] && !fingersExtended[2] && !fingersExtended[3] && !fingersExtended[4];

      // ROCK/METAL: index + pinky extended, middle + ring folded, thumb ignored
      const isRock = fingersExtended[1] && !fingersExtended[2] && !fingersExtended[3] && fingersExtended[4];

      // PINCH: thumb tip touches index tip, middle/ring/pinky folded. During
      // the fog step this single shape does two things depending on
      // movement — see below.
      const isPinch = isPinchShape(landmarks);

      if (isPinch && state.currentStep === 'fog') {
        const tip = landmarks[8];
        if (state.fogReady) {
          const px = (1 - tip.x) * state.canvasWidth;
          const py = tip.y * state.canvasHeight;
          wipeFog(px, py);
        }
        // Moving while pinching = wiping, and resets the hold-to-reveal
        // timer. Holding still (like a little finger heart) lets the timer
        // below accumulate toward triggerReveal().
        if (!state.pinchAnchor) state.pinchAnchor = { x: tip.x, y: tip.y };
        const moved = Math.hypot(tip.x - state.pinchAnchor.x, tip.y - state.pinchAnchor.y);
        if (moved > CONFIG.PINCH_MOVE_THRESHOLD) {
          resetGestureProgress();
          state.pinchAnchor = { x: tip.x, y: tip.y };
        }
      } else {
        state.pinchAnchor = null;
        resetWipeTrail();
      }

      let detectedGesture = null;
      if (isPinch) detectedGesture = 'pinch';
      else if (isOpenPalm) detectedGesture = 'open_palm';
      else if (isPeace) detectedGesture = 'peace';
      else if (isThumbsUp) detectedGesture = 'thumbs_up';
      else if (isPointUp) detectedGesture = 'point_up';
      else if (isRock) detectedGesture = 'rock';

      // Gesture state machine
      const now = Date.now();

      if (detectedGesture) {
        if (state.gestureState === 'none' || state.gestureType !== detectedGesture) {
          state.gestureState = 'detecting';
          state.gestureType = detectedGesture;
          state.gestureStartTime = now;
          state.gestureDebounceFrames = 1;
        } else if (state.gestureState === 'detecting') {
          state.gestureDebounceFrames++;
          if (state.gestureDebounceFrames >= state.gestureDebounceRequired) {
            state.gestureState = 'holding';
          }
        } else if (state.gestureState === 'holding') {
          const held = now - state.gestureStartTime;
          const progress = Math.min(held / CONFIG.GESTURE_HOLD_MS, 1);

          updateGestureHUD(detectedGesture, progress);

          if (progress >= 1) {
            state.gestureState = 'confirmed';
            onGestureConfirmed(detectedGesture);
          }
        }
      } else {
        resetGestureProgress();
      }
    }

    function updateGestureHUD(gesture, progress) {
      // No label text on purpose — the progress bar shows a gesture is
      // being recognized without spoiling which one does what.
      els.hudProgress.style.width = `${progress * 100}%`;
      els.gestureHud.classList.add('active');
    }

    function resetGestureProgress() {
      if (state.gestureState !== 'none') {
        state.gestureState = 'none';
        state.gestureType = null;
        state.gestureStartTime = 0;
        state.gestureDebounceFrames = 0;
        els.gestureHud.classList.remove('active');
      }
    }

    function onGestureConfirmed(gesture) {
      resetGestureProgress();

      switch (gesture) {
        case 'open_palm':
          if (state.currentStep === 'reveal') downloadReactionVideo();
          break;
        case 'peace':
          if (state.currentStep === 'photo') enableFogAndMusic();
          else if (state.currentStep === 'reveal') resetGame();
          break;
        case 'thumbs_up':
        case 'point_up':
        case 'rock':
          if (state.currentStep === 'fog') showMeme(gesture);
          break;
        case 'pinch':
          if (state.currentStep === 'fog') triggerReveal();
          break;
      }
    }

    // ==========================================
    // CAMERA SETUP
    // ==========================================
    async function setupCamera() {
      showLoading();

      try {
        state.stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: { echoCancellation: true, noiseSuppression: true }
        });

        state.video = els.videoInput;
        state.video.srcObject = state.stream;
        await state.video.play();

        // Wait for video metadata
        await new Promise(resolve => {
          if (state.video.videoWidth > 0) resolve();
          else state.video.onloadedmetadata = resolve;
        });

        state.videoWidth = state.video.videoWidth;
        state.videoHeight = state.video.videoHeight;

        // Setup canvas
        state.canvas = els.mainCanvas;
        state.ctx = state.canvas.getContext('2d', { alpha: false });
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        initBreathListener();

        debug(`camera ok: ${state.videoWidth}x${state.videoHeight}`);
        return true;
      } catch (err) {
        console.error('Camera error:', err);
        debug('camera error: ' + (err?.message || err));
        return false;
      }
    }

    function resizeCanvas() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      state.canvasWidth = w;
      state.canvasHeight = h;
      state.canvas.width = w;
      state.canvas.height = h;
      if (state.fogCanvas) {
        state.fogCanvas.width = w;
        state.fogCanvas.height = h;
      }
    }

    // ==========================================
    // BREATH-FOG MIC LISTENER (reuses the existing mic stream — no
    // second getUserMedia/permission prompt)
    // ==========================================
    function initBreathListener() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(state.stream);
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = CONFIG.BREATH_HIGHPASS_HZ;
        src.connect(hp);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        hp.connect(analyser);
        const buf = new Float32Array(analyser.frequencyBinCount);
        state.audioCtx = audioCtx;

        function tick() {
          requestAnimationFrame(tick);
          analyser.getFloatTimeDomainData(buf);
          let sum = 0;
          for (const v of buf) sum += v * v;
          const rms = Math.sqrt(sum / buf.length);
          if (rms > CONFIG.BREATH_RMS_THRESHOLD && state.currentStep === 'fog') {
            addFog(rms);
          }
        }
        tick();
      } catch (err) {
        console.warn('Breath listener unavailable:', err);
      }
    }

    // ==========================================
    // FOG MASK (add via breath, erase via pinch-wipe)
    // ==========================================
    function addFog(volume) {
      if (state.breathCooldown > 0) { state.breathCooldown--; return; }
      state.fogReady = true;
      const ctx = state.fogCtx;
      const w = state.canvasWidth, h = state.canvasHeight;
      const blobs = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < blobs; i++) {
        const cx = w * 0.5 + (Math.random() - 0.5) * w * 0.6;
        const cy = h * 0.5 + (Math.random() - 0.5) * h * 0.3;
        const r = 100 + Math.random() * 200 + volume * 600;
        const a = Math.min(1, 0.4 + volume * 4);
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, `rgba(255,255,255,${a})`);
        g.addColorStop(0.5, `rgba(255,255,255,${a * 0.65})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      state.breathCooldown = CONFIG.BREATH_COOLDOWN_FRAMES;
    }

    function wipeFog(rawX, rawY) {
      const SMOOTH = 0.4;
      if (state.wipeSmoothX === null) { state.wipeSmoothX = rawX; state.wipeSmoothY = rawY; }
      state.wipeSmoothX += SMOOTH * (rawX - state.wipeSmoothX);
      state.wipeSmoothY += SMOOTH * (rawY - state.wipeSmoothY);
      const x = state.wipeSmoothX, y = state.wipeSmoothY;
      state.wipeTrail.push({ x, y });
      if (state.wipeTrail.length > 6) state.wipeTrail.shift();
      if (state.wipeTrail.length < 2) return;

      const ctx = state.fogCtx;
      const trail = state.wipeTrail;
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
      ctx.lineWidth = 50;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      if (trail.length === 2) {
        ctx.moveTo(trail[0].x, trail[0].y);
        ctx.lineTo(trail[1].x, trail[1].y);
      } else {
        ctx.moveTo((trail[0].x + trail[1].x) / 2, (trail[0].y + trail[1].y) / 2);
        for (let i = 1; i < trail.length - 1; i++) {
          ctx.quadraticCurveTo(trail[i].x, trail[i].y, (trail[i].x + trail[i + 1].x) / 2, (trail[i].y + trail[i + 1].y) / 2);
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    function resetWipeTrail() {
      state.wipeSmoothX = null;
      state.wipeSmoothY = null;
      state.wipeTrail = [];
    }

    // ==========================================
    // RENDER LOOP (compositing)
    // ==========================================
    function renderLoop(timestamp) {
      state.animationId = requestAnimationFrame(renderLoop);

      // Throttle FPS
      if (timestamp - state.lastFrameTime < CONFIG.FRAME_INTERVAL) return;
      state.lastFrameTime = timestamp;

      if (!state.video || state.video.readyState < 2) return;

      if (state.handLandmarker) {
        const result = state.handLandmarker.detectForVideo(state.video, Math.round(timestamp));
        processHands(result);
      }

      const ctx = state.ctx;
      const cw = state.canvasWidth;
      const ch = state.canvasHeight;
      const vw = state.videoWidth;
      const vh = state.videoHeight;

      // Calculate video draw rect (cover, centered)
      const scale = Math.max(cw / vw, ch / vh);
      const drawW = vw * scale;
      const drawH = vh * scale;
      const drawX = (cw - drawW) / 2;
      const drawY = (ch - drawH) / 2;

      // Clear
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, cw, ch);

      // Draw video (mirrored for selfie view)
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(state.video, -drawX - drawW, drawY, drawW, drawH);
      ctx.restore();

      if (state.currentStep === 'fog' && state.fogReady) {
        drawFogOverlay(ctx, drawX, drawY, drawW, drawH);
      }

      if (state.shatterActive) {
        updateAndDrawShatter(ctx);
      }

      if (state.currentStep === 'camera' && state.frameBox) {
        drawFrameBrackets(ctx, state.frameBox);
      }

      if (state.currentStep !== 'loading' && state.currentStep !== 'reveal') {
        for (const hand of state.allHands) {
          drawHandSkeleton(ctx, hand);
        }
      }
    }

    function drawFogOverlay(ctx, drawX, drawY, drawW, drawH) {
      const cw = state.canvasWidth, ch = state.canvasHeight;
      const localX = -drawX - drawW; // same mirrored-space offset the plain video path uses

      if (!state.blurCanvas) {
        state.blurCanvas = document.createElement('canvas');
        state.blurCtx = state.blurCanvas.getContext('2d');
      }
      state.blurCanvas.width = cw;
      state.blurCanvas.height = ch;
      state.blurCtx.save();
      state.blurCtx.scale(-1, 1);
      state.blurCtx.filter = 'blur(14px) brightness(1.05)';
      state.blurCtx.drawImage(state.video, localX, drawY, drawW, drawH);
      state.blurCtx.restore();
      state.blurCtx.fillStyle = 'rgba(205,218,228,0.35)';
      state.blurCtx.fillRect(0, 0, cw, ch);

      // Mask by the fog canvas — plain, unmirrored coordinates, since the
      // mask is abstract alpha blobs, not derived from mirrored video.
      state.blurCtx.globalCompositeOperation = 'destination-in';
      state.blurCtx.drawImage(state.fogCanvas, 0, 0);
      state.blurCtx.globalCompositeOperation = 'source-over';

      // Composite onto the main canvas. `ctx` still carries the caller's
      // scale(-1,1); this layer is already mirrored itself, so cancel that
      // transform locally before blitting it full-frame.
      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(state.blurCanvas, 0, 0);
      ctx.restore();
    }

    function drawFrameBrackets(ctx, box) {
      const { x1: left, y1: top, x2: right, y2: bottom, progress } = box;
      const cLen = (right - left) * 0.18;
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,${0.5 + progress * 0.5})`;
      ctx.lineWidth = 2 + progress * 1.5;
      ctx.lineCap = 'square';
      [
        [left, top + cLen, left, top, left + cLen, top],
        [right - cLen, top, right, top, right, top + cLen],
        [left, bottom - cLen, left, bottom, left + cLen, bottom],
        [right - cLen, bottom, right, bottom, right, bottom - cLen],
      ].forEach(([ax, ay, bx, by, cx, cy]) => {
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.lineTo(cx, cy);
        ctx.stroke();
      });
      ctx.restore();
    }

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [17, 18], [18, 19], [19, 20],
      [0, 17],
    ];

    function drawHandSkeleton(ctx, landmarks) {
      const cw = state.canvasWidth, ch = state.canvasHeight;
      const pts = landmarks.map(p => ({ x: (1 - p.x) * cw, y: p.y * ch }));

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(255,255,255,0.85)';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 3;
      for (const [iA, iB] of HAND_CONNECTIONS) {
        ctx.beginPath();
        ctx.moveTo(pts[iA].x, pts[iA].y);
        ctx.lineTo(pts[iB].x, pts[iB].y);
        ctx.stroke();
      }

      ctx.shadowBlur = 6;
      ctx.fillStyle = 'white';
      for (const p of pts) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // ==========================================
    // PHOTO CAPTURE — two-hand pinch frame -> countdown -> photobooth
    // filter -> shatter transition
    // ==========================================
    async function triggerPhotoCountdown() {
      if (state.countdownActive) return;
      state.countdownActive = true;

      els.countdownOverlay.classList.add('active');
      for (let i = 3; i >= 1; i--) {
        els.countdownNumber.textContent = i;
        await new Promise(r => setTimeout(r, 800));
      }

      els.countdownNumber.innerHTML = '<span class="msym">photo_camera</span>';
      await capturePhoto();

      els.countdownOverlay.classList.remove('active');
      state.countdownActive = false;
    }

    function gaussianNoise(std) {
      const u1 = Math.random() || 1e-6;
      const u2 = Math.random();
      return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2) * std;
    }

    function applyPhotoboothEffect(imageData) {
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        let v = gray * CONFIG.PHOTOBOOTH_CONTRAST_ALPHA + CONFIG.PHOTOBOOTH_BRIGHTNESS_BETA;
        v += gaussianNoise(CONFIG.PHOTOBOOTH_NOISE_STD);
        v = Math.max(0, Math.min(255, v));
        d[i] = d[i + 1] = d[i + 2] = v;
      }
    }

    async function capturePhoto() {
      const snap = document.createElement('canvas');
      snap.width = state.canvasWidth;
      snap.height = state.canvasHeight;
      const sCtx = snap.getContext('2d');
      sCtx.drawImage(state.canvas, 0, 0);
      const imageData = sCtx.getImageData(0, 0, snap.width, snap.height);
      applyPhotoboothEffect(imageData);
      sCtx.putImageData(imageData, 0, 0);

      startShatter(snap);
      state.currentStep = 'photo';
    }

    function startShatter(sourceCanvas) {
      const cols = CONFIG.SHATTER_COLS, rows = CONFIG.SHATTER_ROWS;
      const fragW = sourceCanvas.width / cols, fragH = sourceCanvas.height / rows;
      const boardCx = sourceCanvas.width / 2, boardCy = sourceCanvas.height / 2;
      const fragments = [];

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const sx = col * fragW, sy = row * fragH;
          const fragCanvas = document.createElement('canvas');
          fragCanvas.width = Math.ceil(fragW);
          fragCanvas.height = Math.ceil(fragH);
          fragCanvas.getContext('2d').drawImage(sourceCanvas, sx, sy, fragW, fragH, 0, 0, fragCanvas.width, fragCanvas.height);

          const cx = sx + fragW / 2, cy = sy + fragH / 2;
          const dirX = cx - boardCx, dirY = cy - boardCy;
          const dirLen = Math.max(1, Math.hypot(dirX, dirY));
          const speed = 90 + Math.random() * 160;

          fragments.push({
            canvas: fragCanvas,
            x: cx, y: cy, w: fragW, h: fragH,
            vx: (dirX / dirLen) * speed + (Math.random() - 0.5) * 40,
            vy: (dirY / dirLen) * speed + (Math.random() - 0.5) * 40 - 60,
            rotation: 0,
            rotationSpeed: (Math.random() - 0.5) * 6,
            gravity: 220 + Math.random() * 80,
          });
        }
      }

      state.shatterFragments = fragments;
      state.shatterActive = true;
      state.shatterStartedAt = performance.now();
    }

    function updateAndDrawShatter(ctx) {
      const elapsed = performance.now() - state.shatterStartedAt;
      const t = Math.min(1, elapsed / CONFIG.SHATTER_DURATION_MS);
      if (t >= 1) {
        state.shatterActive = false;
        state.shatterFragments = [];
        return;
      }

      const dt = 1 / 60;
      const fadeStart = 0.45;
      ctx.save();
      for (const frag of state.shatterFragments) {
        frag.x += frag.vx * dt;
        frag.y += frag.vy * dt;
        frag.vy += frag.gravity * dt;
        frag.rotation += frag.rotationSpeed * dt;

        const alpha = t < fadeStart ? 1 : Math.max(0, 1 - (t - fadeStart) / (1 - fadeStart));
        const scale = 1 - t * 0.25;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(frag.x, frag.y);
        ctx.rotate(frag.rotation);
        ctx.scale(scale, scale);
        ctx.drawImage(frag.canvas, -frag.w / 2, -frag.h / 2, frag.w, frag.h);
        ctx.restore();
      }
      ctx.restore();
    }

    // ==========================================
    // STEP HANDLERS
    // ==========================================
    function enableFogAndMusic() {
      state.currentStep = 'fog';
      playMusic();
      startRecording();
    }

    function showMeme(gesture) {
      const pool = CONFIG.memePools[gesture];
      const texts = pool && pool.length ? pool : CONFIG.memePools.thumbs_up;
      els.memeText.innerHTML = texts[Math.floor(Math.random() * texts.length)];   // sumber: CONFIG
      els.memePopup.classList.add('active');
      clearTimeout(state.memeTimer);
      state.memeTimer = setTimeout(() => els.memePopup.classList.remove('active'), CONFIG.MEME_DURATION_MS);
    }

    function triggerReveal() {
      stopRecording();
      els.memePopup.classList.remove('active');

      els.revealMessage.innerHTML = CONFIG.messageLines.map((line, i) =>
        `<span class="line" style="animation-delay: ${i * 0.15}s">${line}</span>`
      ).join('<br>');

      createParticles(50);
      showRevealScreen();
    }

    // ==========================================
    // RECORDING
    // ==========================================
    function startRecording() {
      if (!state.stream) return;

      try {
        state.videoMimeType = detectVideoMimeType();
        console.log('Recording MIME:', state.videoMimeType || 'default');

        // Get canvas stream (composited)
        const canvasStream = state.canvas.captureStream(30);
        const videoTracks = canvasStream.getVideoTracks();
        const audioTracks = state.stream.getAudioTracks();

        const combinedStream = new MediaStream([...videoTracks, ...audioTracks]);

        state.recordedChunks = [];
        state.mediaRecorder = new MediaRecorder(combinedStream, {
          mimeType: state.videoMimeType
        });

        state.mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) state.recordedChunks.push(e.data);
        };

        state.mediaRecorder.onstop = () => {
          const blob = new Blob(state.recordedChunks, { type: state.mediaRecorder.mimeType });
          saveRecording(blob);
        };

        // No timeslice: MediaRecorder fires ondataavailable once, on stop,
        // giving one well-formed blob. Timesliced chunks concatenated into
        // one Blob commonly end up with broken/missing duration metadata.
        state.mediaRecorder.start();
        state.recordingStartTime = Date.now();

        state.recordingTimer = setInterval(() => {
          const elapsed = Date.now() - state.recordingStartTime;
          els.recTime.textContent = formatTime(elapsed);

          if (elapsed >= CONFIG.RECORDING_MAX_SECONDS * 1000) {
            stopRecording();
          }
        }, 200);

        els.recIndicator.classList.add('active');

      } catch (err) {
        console.error('Recording error:', err);
        tryFallbackRecording();
      }
    }

    function tryFallbackRecording() {
      const fallbacks = ['video/webm;codecs=vp8,opus', 'video/webm;codecs=opus', 'video/webm', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4'];

      for (const type of fallbacks) {
        try {
          const canvasStream = state.canvas.captureStream(30);
          const combinedStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...state.stream.getAudioTracks()
          ]);

          state.mediaRecorder = new MediaRecorder(combinedStream, { mimeType: type });
          setupRecorderCallbacks();
          state.mediaRecorder.start();
          state.recordingStartTime = Date.now();
          state.recordingTimer = setInterval(() => {
            els.recTime.textContent = formatTime(Date.now() - state.recordingStartTime);
          }, 200);
          els.recIndicator.classList.add('active');
          return;
        } catch (e) { continue; }
      }
      console.error('All recording formats failed');
    }

    function setupRecorderCallbacks() {
      state.mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) state.recordedChunks.push(e.data);
      };
      state.mediaRecorder.onstop = () => {
        const blob = new Blob(state.recordedChunks, { type: state.mediaRecorder.mimeType });
        saveRecording(blob);
      };
    }

    function stopRecording() {
      if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
        state.mediaRecorder.stop();
      }
      if (state.recordingTimer) {
        clearInterval(state.recordingTimer);
        state.recordingTimer = null;
      }
      els.recIndicator.classList.remove('active');
      // Music keeps playing through reveal — it's just background music,
      // not tied to the recording lifecycle.
    }

    function saveRecording(blob) {
      if (state.recordingBlobUrl) URL.revokeObjectURL(state.recordingBlobUrl);
      const ext = state.videoMimeType.includes('mp4') ? 'mp4' : 'webm';
      state.recordingBlobUrl = URL.createObjectURL(blob);
      state.recordingFileName = `reaction-ami-${Date.now()}.${ext}`;
    }

    // ==========================================
    // GESTURE-TRIGGERED REVEAL ACTIONS
    // ==========================================
    function downloadReactionVideo() {
      if (!state.recordingBlobUrl) return;
      const a = document.createElement('a');
      a.href = state.recordingBlobUrl;
      a.download = state.recordingFileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('<span class="msym">download</span> Video reaksi diunduh', 2500);
    }

    function resetGame() {
      stopMusic();
      state.recordedChunks = [];
      if (state.recordingBlobUrl) {
        URL.revokeObjectURL(state.recordingBlobUrl);
        state.recordingBlobUrl = null;
      }
      clearTimeout(state.memeTimer);
      els.memePopup.classList.remove('active');
      els.recIndicator.classList.remove('active');
      els.recTime.textContent = '00:00';
      els.gestureHud.classList.remove('active');
      els.particles.innerHTML = '';

      if (state.fogCtx) state.fogCtx.clearRect(0, 0, state.canvasWidth, state.canvasHeight);
      state.fogReady = false;
      resetWipeTrail();
      state.shatterActive = false;
      state.shatterFragments = [];
      state.frameHoldStart = null;
      state.frameBox = null;

      // Restart from camera step (hide reveal screen, back to raw camera view)
      els.revealScreen.classList.remove('active');
      els.revealScreen.classList.add('hidden');
      state.currentStep = 'camera';
      showToast('Kembali ke kamera...', 1500);
    }

    // ==========================================
    // ENTER CAMERA STEP (auto, once permission is granted)
    // ==========================================
    async function enterCameraStep() {
      state.fogCanvas = els.fogMaskCanvas;
      state.fogCtx = state.fogCanvas.getContext('2d');
      state.fogCanvas.width = state.canvasWidth;
      state.fogCanvas.height = state.canvasHeight;

      const ok = await initMediaPipe();
      if (!ok) {
        showToast('Model AI gagal load, coba refresh halaman', 5000);
      }

      state.lastFrameTime = performance.now();
      renderLoop(0);

      state.currentStep = 'camera';
    }

    // ==========================================
    // CLEANUP
    // ==========================================
    window.addEventListener('beforeunload', () => {
      if (state.stream) state.stream.getTracks().forEach(t => t.stop());
      if (state.animationId) cancelAnimationFrame(state.animationId);
      if (state.recordingTimer) clearInterval(state.recordingTimer);
      if (state.audioCtx) state.audioCtx.close();
      stopMusic();
    });

    // ==========================================
    // INIT - Auto-start camera flow on page load, no buttons anywhere:
    // permission -> two-hand pinch frame (photo) -> peace (fog+music+record)
    // -> thumbs_up/point_up/rock (meme) / still-pinch (reveal), all gesture-driven
    // ==========================================
    async function init() {
      state.videoMimeType = detectVideoMimeType();
      console.log('Video MIME type:', state.videoMimeType || 'browser default');
      initMusic();
      els.bgMusic.load();

      // Retry permission automatically until granted (no retry button)
      while (!(await setupCamera())) {
        await new Promise(r => setTimeout(r, CONFIG.PERM_RETRY_DELAY_MS));
      }

      await enterCameraStep();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
